[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-flight-recorder-local"
version = "0.1.0a1"
description = "Offline incident recordings and a read-only timeline for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Brandon Gordon" }]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Debuggers",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2", "jsonschema>=4,<5"]

[project.scripts]
afr = "agent_flight_recorder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_flight_recorder = ["static/*", "static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
