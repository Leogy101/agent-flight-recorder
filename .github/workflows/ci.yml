name: Verify recorder and viewer

on: [push, pull_request]

permissions:
  contents: read

jobs:
  python:
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade 'pip>=26.2'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - run: python -m build
      - name: Verify installed wheel without runtime dependencies
        run: |
          python -m venv --without-pip work/installed
          python -m pip --python work/installed/bin/python install --no-index --no-deps dist/*.whl
          work/installed/bin/python tests/installed_smoke.py

  viewer:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - run: python -m pip install --upgrade 'pip>=26.2'
      - run: python -m pip install -e .
      - run: npm ci
        working-directory: viewer
      - run: npm test
        working-directory: viewer
      - run: npm run build
        working-directory: viewer
      - name: Ensure the packaged viewer matches its source
        run: |
          git diff --exit-code -- src/agent_flight_recorder/static/
          test -z "$(git ls-files --others --exclude-standard -- src/agent_flight_recorder/static/)"
      - run: npx playwright install --with-deps chromium
        working-directory: viewer
      - run: node tests/browser-check.mjs
